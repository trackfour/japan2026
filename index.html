<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Trip 2026</title>
  
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f8; }
    
    #sidebar {
      width: 380px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      z-index: 10;
    }
    
    .header { padding: 20px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 20; }
    .header h1 { margin: 0; font-size: 24px; color: #d32f2f; }
    .header p { margin: 5px 0 0 0; color: #555; font-size: 14px; }
    
    .day-card { border-bottom: 1px solid #eee; }
    
    .day-header {
      padding: 15px 20px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-header:hover { background: #f9f9f9; }
    .day-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #222; }
    .day-info .date { font-size: 12px; color: #d32f2f; font-weight: bold; display: block; margin-bottom: 2px; }
    .dropdown-icon { font-size: 12px; color: #888; transition: transform 0.3s; }
    
    /* Active State for Accordion */
    .day-card.active .day-header { background: #fdf2f2; border-left: 4px solid #d32f2f; padding-left: 16px; }
    .day-card.active .dropdown-icon { transform: rotate(180deg); }
    
    .places-list {
      display: none;
      background: #fafafa;
      padding: 0;
      margin: 0;
      list-style: none;
      border-top: 1px solid #eee;
    }
    .day-card.active .places-list { display: block; }
    
    .place-item {
      padding: 12px 20px 12px 40px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    .place-item:last-child { border-bottom: none; }
    .place-item:hover { background: #f0f0f0; }
    .place-item h4 { margin: 0 0 3px 0; font-size: 14px; color: #333; }
    .place-item p { margin: 0; font-size: 12px; color: #666; line-height: 1.4; }
    
    /* Transit Info Styles */
    .travel-info {
      display: none;
      padding: 15px 20px;
      background: #eef5fb;
      border-top: 1px solid #dce8f3;
    }
    .travel-info h4 { margin: 0 0 5px 0; font-size: 13px; color: #0056b3; text-transform: uppercase; letter-spacing: 0.5px; }
    .travel-info p { margin: 0; font-size: 13px; color: #444; line-height: 1.5; }
    .day-card.active .travel-info { display: block; }

    #map { flex-grow: 1; height: 100%; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid #ddd; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>Japan Itinerary</h1>
      <p>Tokyo & Kyoto • Nov 13 - 22</p>
    </div>
    <div id="itinerary-list"></div>
  </div>

  <div id="map"></div>
  
  <script>
    let map;
    let markers = [];
    let infoWindow;
    let geocoder;

    const itinerary = [
      {
        date: "Nov 13",
        title: "Arrive in Tokyo & Shinjuku",
        travel: "When arriving at Shinjuku Station, follow signs for the <b>East Exit (Higashi-guchi)</b>. It is the shortest and most direct walk to Kabukicho and will keep you from getting lost in the massive station complex.",
        places: [
          { title: "Tokyo Airbnb", address: "2-chōme-2-21 Kabukichō, Shinjuku City, Tokyo 160-0021, Japan", desc: "Our home base for Tokyo." },
          { title: "Tokyo Metropolitan Government Building", address: "2-chome-8-1 Nishishinjuku, Shinjuku City, Tokyo 163-8001, Japan", desc: "Free observation deck for great city views." },
          { title: "ARTNIA (Square Enix)", address: "6-chome-27-30 Shinjuku, Shinjuku City, Tokyo 160-0022, Japan", desc: "Perfect spot for fantasy RPG merchandise, themed drinks, and plushies." },
          { title: "Conbini Snack Run", address: "1-13-11 Kabukicho, Shinjuku City, Tokyo 160-0021, Japan", desc: "Hit the local Family Mart, 7-11, and Lawson near the hotel." },
          { title: "Golden Gai", address: "1-chome-1-6 Kabukicho, Shinjuku City, Tokyo 160-0021, Japan", desc: "Narrow alleys packed with tiny bars for evening drinks." }
        ]
      },
      {
        date: "Nov 14",
        title: "Shibuya & Harajuku",
        travel: "Take the <b>JR Yamanote Line</b> south. Get off at <b>Harajuku Station (Omotesando Exit)</b> for Meiji Jingu and the pancake run. Later, ride one stop south to <b>Shibuya Station (Hachiko Exit)</b> for the crossing, Nintendo Tokyo, and Don Quijote.",
        places: [
          { title: "Meiji Jingu Shrine", address: "1-1 Yoyogikamizonocho, Shibuya City, Tokyo 151-8557, Japan", desc: "Major shrine surrounded by a massive forested park." },
          { title: "Koffee Mameya", address: "4-chome-15-3 Jingumae, Shibuya City, Tokyo 150-0001, Japan", desc: "Incredible minimalist coffee stand. Perfect for finding a light-roast single-origin pour-over." },
          { title: "A Happy Pancake Omotesando", address: "4-chome-9-3 Jingumae, Shibuya City, Tokyo 150-0001, Japan", desc: "Famous spot for fluffy, jiggly Japanese soufflé pancakes." },
          { title: "Shibuya PARCO (Nintendo, Pokémon, Kojima)", address: "15-1 Udagawacho, Shibuya City, Tokyo 150-8377, Japan", desc: "Nintendo Tokyo, Pokémon Center, and the Kojima Productions store." },
          { title: "Hikiniku to Come Shibuya", address: "2-chome-28-1 Dogenzaka, Shibuya City, Tokyo 150-0043, Japan", desc: "Incredible charcoal-grilled hamburger steaks served over fresh rice." },
          { title: "MEGA Don Quijote Shibuya", address: "28-6 Udagawacho, Shibuya City, Tokyo 150-0042, Japan", desc: "Massive, multi-story discount store." },
          { title: "Shibuya Sky", address: "2-chome-24-12 Shibuya, Shibuya City, Tokyo 150-6145, Japan", desc: "Open-air observation deck overlooking the scramble crossing." }
        ]
      },
      {
        date: "Nov 15",
        title: "Tsukiji, Asakusa & Akihabara",
        travel: "Take the <b>Toei Oedo Line</b> from Shinjuku-nishiguchi direct to <b>Tsukijishijo Station (Exit A1)</b>. To get to Asakusa, take the Hibiya line to Higashi-Ginza and swap to the Asakusa Line. Finally, take the Ginza line to Ueno and transfer to the Yamanote line to hit Akihabara <b>(Electric Town Exit)</b>.",
        places: [
          { title: "Tsukiji Outer Market", address: "4-chome-16-2 Tsukiji, Chuo City, Tokyo 104-0045, Japan", desc: "Arrive early for street food and fresh seafood." },
          { title: "Wagyu Skewers (Tsukiji)", address: "4-chome-10-10 Tsukiji, Chuo City, Tokyo 104-0045, Japan", desc: "Grab incredibly rich, marbled wagyu on a stick—served purely with salt and soy." },
          { title: "TeamLabs Planets", address: "6-chome-1-16 Toyosu, Koto City, Tokyo 135-0061, Japan", desc: "Immersive digital art museum." },
          { title: "Senso-ji Temple & Nakamise", address: "2-chome-3-1 Asakusa, Taito City, Tokyo 111-0032, Japan", desc: "Tokyo's oldest temple. Great place for Curry Pan and Hokkaido Ice Cream." },
          { title: "Imo Pipi Asakusa", address: "2-chome-7-13 Asakusa, Taito City, Tokyo 111-0032, Japan", desc: "Baked sweet potato desserts." },
          { title: "Kappabashi Street", address: "3-chome-18-2 Matsugaya, Taito City, Tokyo 111-0036, Japan", desc: "The Kitchen Town. Great for knives and ceramics." },
          { title: "Akihabara Electric Town", address: "1-chome-15-16 Sotokanda, Chiyoda City, Tokyo 101-0021, Japan", desc: "Anime, gaming, and electronics hub." },
          { title: "Super Potato Akihabara", address: "1-chome-11-2 Sotokanda, Chiyoda City, Tokyo 101-0021, Japan", desc: "Legendary retro gaming store packed with classic consoles and games." },
          { title: "CoCo Ichibanya Akihabara", address: "4 Kanda-hirakawacho, Chiyoda City, Tokyo 101-0027, Japan", desc: "Hearty, customizable Japanese curry." },
          { title: "Kunugiya Udon", address: "1-7-2 Shinjuku, Shinjuku City, Tokyo 160-0022, Japan", desc: "Excellent spot for authentic udon noodles." }
        ]
      },
      {
        date: "Nov 16",
        title: "Sanrio Puroland",
        travel: "Head to <b>Keio Shinjuku Station</b> (connected to the main station but slightly southwest) and take the <b>Keio Line</b> bound for Hashimoto. Get off at <b>Keio-tama-center Station</b>. Puroland is a 5-minute walk straight south from the exit.",
        places: [
          { title: "Sanrio Puroland", address: "1-chome-31 Ochiai, Tama, Tokyo 206-8588, Japan", desc: "Indoor theme park in Tama City." }
        ]
      },
      {
        date: "Nov 17",
        title: "Transit to Kyoto & Downtown",
        travel: "Take the JR Chuo Line from Shinjuku to Tokyo Station to catch the Tokaido Shinkansen. You can use your smart-EX app to seamlessly manage and scan your Shinkansen tickets. Disembark at Kyoto Station and hop on the <b>Karasuma Subway Line</b> to Gojo Station, which is very close to your Airbnb.",
        places: [
          { title: "Kyoto Airbnb", address: "452 Karamonochō, Shimogyo Ward, Kyoto, 600-8197, Japan", desc: "Check-in at our Kyoto home base." },
          { title: "Nishiki Market", address: "Nakagyo Ward, Kyoto, 604-8054, Japan", desc: "Famous narrow street with over 100 food stalls." }
        ]
      },
      {
        date: "Nov 18",
        title: "Higashiyama",
        travel: "Kyoto is highly bus-dependent. From the downtown/Shimogyo area, hop on <b>Bus 207 or 86</b> toward Kiyomizu-michi. Alternatively, take the <b>Keihan Main Line</b> to Kiyomizu-Gojo Station and enjoy the uphill walk to the temple district.",
        places: [
          { title: "Kiyomizu-dera", address: "294 Kiyomizu 1-chome, Higashiyama Ward, Kyoto, 605-0862, Japan", desc: "Iconic wooden temple with a massive veranda." },
          { title: "Gion District", address: "Gionmachi Minamigawa, Higashiyama Ward, Kyoto, 605-0074, Japan", desc: "Historic district with preserved wooden machiya houses and cobblestone streets." },
          { title: "Kura Sushi Kyoto", address: "4 Nishinokyo Hoshigaikecho, Nakagyo Ward, Kyoto, 604-8416, Japan", desc: "Revolving sushi bar." }
        ]
      },
      {
        date: "Nov 19",
        title: "Osaka Day Trip",
        travel: "From Kyoto Station, take the <b>JR Kyoto Line</b> to Osaka Station. Transfer to the <b>Osaka Loop Line</b> to Nishikujo, then swap to the <b>JR Yumesaki Line</b> to Universal City Station. For Round 1 later, take the Hanshin Namba Line down to Osaka Namba.",
        places: [
          { title: "Universal Studios Japan", address: "2-chome-1-33 Sakurajima, Konohana Ward, Osaka, 554-0031, Japan", desc: "Full day trip to Osaka for the theme park." },
          { title: "Round 1 Stadium Sennichimae", address: "1-chome-3-1 Namba, Chuo Ward, Osaka, 542-0076, Japan", desc: "Massive arcade complex near Namba." }
        ]
      },
      {
        date: "Nov 20",
        title: "Arashiyama",
        travel: "Take the <b>JR Sagano Line (San-in Line)</b> directly from Kyoto Station to <b>Saga-Arashiyama Station</b>. It takes about 15 minutes. The bamboo grove is a 10-minute walk west from the station doors.",
        places: [
          { title: "Bamboo Grove", address: "Sagaogurayama Tabuchiyamacho, Ukyo Ward, Kyoto, 616-8394, Japan", desc: "Famous towering bamboo path." },
          { title: "Tenryu-ji Temple", address: "68 Susano-no-baba-cho, Saga-Tenryuji, Ukyo Ward, Kyoto 616-8385, Japan", desc: "Zen temple with beautiful gardens." },
          { title: "Iwatayama Monkey Park", address: "8 Arashiyama Genrokuzancho, Nishikyo Ward, Kyoto, 616-0007, Japan", desc: "Hike up to see wild Japanese macaques and a panoramic view of Kyoto." }
        ]
      },
      {
        date: "Nov 21",
        title: "Fushimi Inari",
        travel: "Take the <b>JR Nara Line</b> from Kyoto Station and get off at <b>Inari Station</b>. Make sure to take a Local train, as Express trains skip this stop! The grand torii gate entrance is directly across the street from the station.",
        places: [
          { title: "Fushimi Inari Taisha", address: "68 Fukakusa Yabunouchicho, Fushimi Ward, Kyoto, 612-0882, Japan", desc: "Thousands of vermilion torii gates." }
        ]
      },
      {
        date: "Nov 22",
        title: "Depart from Osaka",
        travel: "Take the <b>JR Haruka Limited Express</b> directly from Kyoto Station to <b>Kansai International Airport (KIX)</b>. The ride takes about 80 minutes.",
        places: [
          { title: "Kansai International Airport (KIX)", address: "1 Senshukitaminomachi, Izumisano, Osaka 598-0081, Japan", desc: "Fly home." }
        ]
      }
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.3, lng: 137.5 },
        zoom: 6,
        mapTypeControl: false,
        streetViewControl: false
      });

      infoWindow = new google.maps.InfoWindow();
      geocoder = new google.maps.Geocoder();
      const globalBounds = new google.maps.LatLngBounds();
      const sidebar = document.getElementById('itinerary-list');

      // Loop through each Day
      itinerary.forEach((day) => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';
        
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.innerHTML = `
          <div class="day-info">
            <span class="date">${day.date}</span>
            <h3>${day.title}</h3>
          </div>
          <div class="dropdown-icon">▼</div>
        `;

        const placesList = document.createElement('ul');
        placesList.className = 'places-list';

        const dayBounds = new google.maps.LatLngBounds(); 

        day.places.forEach((place) => {
          const placeItem = document.createElement('li');
          placeItem.className = 'place-item';
          placeItem.innerHTML = `
            <h4>${place.title}</h4>
            <p>${place.desc}</p>
          `;
          placesList.appendChild(placeItem);

          const handleMarkerSetup = (position) => {
            const marker = new google.maps.Marker({
              position: position,
              map: map,
              title: place.title
            });
            
            globalBounds.extend(position);
            dayBounds.extend(position);
            markers.push(marker);

            marker.addListener("click", () => {
              infoWindow.setContent(`<b>${place.title}</b><br>${place.desc}`);
              infoWindow.open(map, marker);
            });

            placeItem.onclick = (e) => {
              e.stopPropagation(); 
              map.panTo(position);
              map.setZoom(16);
              infoWindow.setContent(`<b>${place.title}</b><br>${place.desc}`);
              infoWindow.open(map, marker);
            };
          };

          if (place.address) {
            setTimeout(() => {
                geocoder.geocode({ address: place.address }, (results, status) => {
                  if (status === "OK") {
                    handleMarkerSetup(results[0].geometry.location);
                    if(document.querySelectorAll('.day-card.active').length === 0) {
                        map.fitBounds(globalBounds); 
                    }
                  } else {
                    console.error("Could not find address: " + place.address);
                  }
                });
            }, 300); 
          } else {
            handleMarkerSetup({ lat: place.lat, lng: place.lng });
          }
        });

        const travelDiv = document.createElement('div');
        travelDiv.className = 'travel-info';
        travelDiv.innerHTML = `<h4>🚆 Transit Notes</h4><p>${day.travel}</p>`;

        dayHeader.onclick = () => {
          document.querySelectorAll('.day-card').forEach(card => {
            if (card !== dayCard) card.classList.remove('active');
          });
          
          const isActive = dayCard.classList.contains('active');
          if (isActive) {
            dayCard.classList.remove('active');
            map.fitBounds(globalBounds);
          } else {
            dayCard.classList.add('active');
            map.fitBounds(dayBounds);
            
            if (day.places.length === 1) {
               setTimeout(() => map.setZoom(15), 50);
            }
          }
        };

        dayCard.appendChild(dayHeader);
        dayCard.appendChild(placesList);
        dayCard.appendChild(travelDiv);
        sidebar.appendChild(dayCard);
      });
    }
  </script>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEiPAdSz2KKmF44XVWrkzC-eVV1MNvMfM&callback=initMap" async defer></script>
</body>
</html>
