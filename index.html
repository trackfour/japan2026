<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japan Trip 2026</title>
  
  <style>
    body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f6f8; }
    
    #sidebar {
      width: 380px;
      background: #fff;
      border-right: 1px solid #ddd;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      box-shadow: 2px 0 5px rgba(0,0,0,0.05);
      z-index: 10;
    }
    
    .header { padding: 20px; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 20; }
    .header h1 { margin: 0; font-size: 24px; color: #d32f2f; }
    .header p { margin: 5px 0 0 0; color: #555; font-size: 14px; }
    
    .day-card { border-bottom: 1px solid #eee; }
    
    .day-header {
      padding: 15px 20px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .day-header:hover { background: #f9f9f9; }
    .day-info h3 { margin: 0 0 4px 0; font-size: 16px; color: #222; }
    .day-info .date { font-size: 12px; color: #d32f2f; font-weight: bold; display: block; margin-bottom: 2px; }
    .dropdown-icon { font-size: 12px; color: #888; transition: transform 0.3s; }
    
    /* Active State for Accordion */
    .day-card.active .day-header { background: #fdf2f2; border-left: 4px solid #d32f2f; padding-left: 16px; }
    .day-card.active .dropdown-icon { transform: rotate(180deg); }
    
    .places-list {
      display: none;
      background: #fafafa;
      padding: 0;
      margin: 0;
      list-style: none;
      border-top: 1px solid #eee;
    }
    .day-card.active .places-list { display: block; }
    
    .place-item {
      padding: 12px 20px 12px 40px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    .place-item:last-child { border-bottom: none; }
    .place-item:hover { background: #f0f0f0; }
    .place-item h4 { margin: 0 0 3px 0; font-size: 14px; color: #333; }
    .place-item p { margin: 0; font-size: 12px; color: #666; line-height: 1.4; }
    
    /* New Transit Info Styles */
    .travel-info {
      display: none;
      padding: 15px 20px;
      background: #eef5fb;
      border-top: 1px solid #dce8f3;
    }
    .travel-info h4 { margin: 0 0 5px 0; font-size: 13px; color: #0056b3; text-transform: uppercase; letter-spacing: 0.5px; }
    .travel-info p { margin: 0; font-size: 13px; color: #444; line-height: 1.5; }
    .day-card.active .travel-info { display: block; }

    #map { flex-grow: 1; height: 100%; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid #ddd; }
      #map { height: 60vh; }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>Japan Itinerary</h1>
      <p>Tokyo & Kyoto • Nov 13 - 22</p>
    </div>
    <div id="itinerary-list"></div>
  </div>

  <div id="map"></div>
  
  <script>
    let map;
    let markers = [];
    let infoWindow;

    const itinerary = [
      {
        date: "Nov 13",
        title: "Arrive in Tokyo & Shinjuku",
        travel: "When arriving at Shinjuku Station, follow signs for the <b>East Exit (Higashi-guchi)</b>. It is the shortest and most direct walk to Kabukicho and will keep you from getting lost in the massive station complex.",
        places: [
          { title: "Hotel in Kabukicho", lat: 35.6958, lng: 139.7046, desc: "Our home base for Tokyo." },
          { title: "Tokyo Metropolitan Government Building", lat: 35.6896, lng: 139.6921, desc: "Free observation deck for great city views." },
          { title: "Conbini Snack Run", lat: 35.6940, lng: 139.7020, desc: "Hit the local Family Mart, 7-11, and Lawson near the hotel." },
          { title: "Golden Gai", lat: 35.6938, lng: 139.7046, desc: "Narrow alleys packed with tiny bars for evening drinks." }
        ]
      },
      {
        date: "Nov 14",
        title: "Shibuya & Harajuku",
        travel: "Take the <b>JR Yamanote Line</b> south. Get off at <b>Harajuku Station (Omotesando Exit)</b> for Meiji Jingu and the pancake run. Later, ride one stop south to <b>Shibuya Station (Hachiko Exit)</b> for the crossing, Nintendo Tokyo, and Don Quijote.",
        places: [
          { title: "Meiji Jingu Shrine", lat: 35.6764, lng: 139.6993, desc: "Major shrine surrounded by a massive forested park." },
          { title: "A Happy Pancake Omotesando", lat: 35.6655, lng: 139.7084, desc: "Famous spot for fluffy, jiggly Japanese soufflé pancakes." },
          { title: "Nintendo TOKYO & Pokémon Center", lat: 35.6622, lng: 139.6987, desc: "Located inside Shibuya PARCO." },
          { title: "Hikiniku to Come Shibuya", lat: 35.6606, lng: 139.6955, desc: "Incredible charcoal-grilled hamburger steaks served over fresh rice." },
          { title: "MEGA Don Quijote Shibuya", lat: 35.6604, lng: 139.6980, desc: "Massive, multi-story discount store." },
          { title: "Shibuya Sky", lat: 35.6580, lng: 139.7021, desc: "Open-air observation deck overlooking the scramble crossing." }
        ]
      },
      {
        date: "Nov 15",
        title: "Tsukiji, Asakusa & Akihabara",
        travel: "Take the <b>Toei Oedo Line</b> from Shinjuku-nishiguchi direct to <b>Tsukijishijo Station (Exit A1)</b>. To get to Asakusa, take the Hibiya line to Higashi-Ginza and swap to the Asakusa Line. Finally, take the Ginza line to Ueno and transfer to the Yamanote line to hit Akihabara <b>(Electric Town Exit)</b>.",
        places: [
          { title: "Tsukiji Outer Market", lat: 35.6655, lng: 139.7707, desc: "Arrive early for street food and fresh seafood." },
          { title: "TeamLabs Planets", lat: 35.6499, lng: 139.7898, desc: "Immersive digital art museum." },
          { title: "Senso-ji Temple & Nakamise", lat: 35.7147, lng: 139.7967, desc: "Tokyo's oldest temple. Great place for Curry Pan and Hokkaido Ice Cream." },
          { title: "Imo Pipi Asakusa", lat: 35.7135, lng: 139.7944, desc: "Baked sweet potato desserts." },
          { title: "Kappabashi Street", lat: 35.7153, lng: 139.7885, desc: "The Kitchen Town. Great for knives and ceramics." },
          { title: "Akihabara Electric Town", lat: 35.6983, lng: 139.7731, desc: "Anime, gaming, and electronics hub." },
          { title: "CoCo Ichibanya Akihabara", lat: 35.6988, lng: 139.7744, desc: "Hearty, customizable Japanese curry." },
          { title: "Kunugiya Udon", lat: 35.7001, lng: 139.7745, desc: "Excellent spot for authentic udon noodles." }
        ]
      },
      {
        date: "Nov 16",
        title: "Sanrio Puroland",
        travel: "Head to <b>Keio Shinjuku Station</b> (connected to the main station but slightly southwest) and take the <b>Keio Line</b> bound for Hashimoto. Get off at <b>Keio-tama-center Station</b>. Puroland is a 5-minute walk straight south from the exit.",
        places: [
          { title: "Sanrio Puroland", lat: 35.6244, lng: 139.4291, desc: "Indoor theme park in Tama City." }
        ]
      },
      {
        date: "Nov 17",
        title: "Transit to Kyoto & Downtown",
        travel: "Take the JR Chuo Line from Shinjuku to Tokyo Station to catch the Tokaido Shinkansen. You can use your smart-EX app to seamlessly manage and scan your Shinkansen tickets. Disembark at Kyoto Station and hop on the <b>Karasuma Subway Line</b> to reach the Shimogyo Ward area.",
        places: [
          { title: "Hotel in Shimogyo Ward", lat: 35.0045, lng: 135.7632, desc: "Check-in at our Kyoto home base." },
          { title: "Nishiki Market", lat: 35.0050, lng: 135.7649, desc: "Famous narrow street with over 100 food stalls." }
        ]
      },
      {
        date: "Nov 18",
        title: "Higashiyama",
        travel: "Kyoto is highly bus-dependent. From the downtown/Shimogyo area, hop on <b>Bus 207 or 86</b> toward Kiyomizu-michi. Alternatively, take the <b>Keihan Main Line</b> to Kiyomizu-Gojo Station and enjoy the uphill walk to the temple district.",
        places: [
          { title: "Kiyomizu-dera", lat: 34.9948, lng: 135.7850, desc: "Iconic wooden temple with a massive veranda." },
          { title: "Kura Sushi Kyoto", lat: 34.9912, lng: 135.7588, desc: "Revolving sushi bar." }
        ]
      },
      {
        date: "Nov 19",
        title: "Osaka Day Trip",
        travel: "From Kyoto Station, take the <b>JR Kyoto Line</b> to Osaka Station. Transfer to the <b>Osaka Loop Line</b> to Nishikujo, then swap to the <b>JR Yumesaki Line</b> to Universal City Station. For Round 1 later, take the Hanshin Namba Line down to Osaka Namba.",
        places: [
          { title: "Universal Studios Japan", lat: 34.6654, lng: 135.4323, desc: "Full day trip to Osaka for the theme park." },
          { title: "Round 1 Stadium Sennichimae", lat: 34.6675, lng: 135.5028, desc: "Massive arcade complex near Namba." }
        ]
      },
      {
        date: "Nov 20",
        title: "Arashiyama",
        travel: "Take the <b>JR Sagano Line (San-in Line)</b> directly from Kyoto Station to <b>Saga-Arashiyama Station</b>. It takes about 15 minutes. The bamboo grove is a 10-minute walk west from the station doors.",
        places: [
          { title: "Bamboo Grove", lat: 35.0093, lng: 135.6670, desc: "Famous towering bamboo path." },
          { title: "Tenryu-ji Temple", lat: 35.0084, lng: 135.6737, desc: "Zen temple with beautiful gardens." }
        ]
      },
      {
        date: "Nov 21",
        title: "Fushimi Inari",
        travel: "Take the <b>JR Nara Line</b> from Kyoto Station and get off at <b>Inari Station</b>. Make sure to take a Local train, as Express trains skip this stop! The grand torii gate entrance is directly across the street from the station.",
        places: [
          { title: "Fushimi Inari Taisha", lat: 34.9671, lng: 135.7726, desc: "Thousands of vermilion torii gates." }
        ]
      },
      {
        date: "Nov 22",
        title: "Depart from Osaka",
        travel: "Take the <b>JR Haruka Limited Express</b> directly from Kyoto Station to <b>Kansai International Airport (KIX)</b>. The ride takes about 80 minutes.",
        places: [
          { title: "Kansai International Airport (KIX)", lat: 34.4320, lng: 135.2304, desc: "Fly home." }
        ]
      }
    ];

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.3, lng: 137.5 },
        zoom: 6,
        mapTypeControl: false,
        streetViewControl: false
      });

      infoWindow = new google.maps.InfoWindow();
      const globalBounds = new google.maps.LatLngBounds();
      const sidebar = document.getElementById('itinerary-list');

      // Loop through each Day
      itinerary.forEach((day) => {
        const dayCard = document.createElement('div');
        dayCard.className = 'day-card';
        
        // Create the clickable header for the day
        const dayHeader = document.createElement('div');
        dayHeader.className = 'day-header';
        dayHeader.innerHTML = `
          <div class="day-info">
            <span class="date">${day.date}</span>
            <h3>${day.title}</h3>
          </div>
          <div class="dropdown-icon">▼</div>
        `;

        // Create the container for the specific places
        const placesList = document.createElement('ul');
        placesList.className = 'places-list';

        const dayBounds = new google.maps.LatLngBounds(); 

        // Loop through the places within the day
        day.places.forEach((place) => {
          const position = { lat: place.lat, lng: place.lng };
          
          const marker = new google.maps.Marker({
            position: position,
            map: map,
            title: place.title
          });
          
          globalBounds.extend(position);
          dayBounds.extend(position);
          markers.push(marker);

          marker.addListener("click", () => {
            infoWindow.setContent(`<b>${place.title}</b><br>${place.desc}`);
            infoWindow.open(map, marker);
          });

          const placeItem = document.createElement('li');
          placeItem.className = 'place-item';
          placeItem.innerHTML = `
            <h4>${place.title}</h4>
            <p>${place.desc}</p>
          `;
          
          placeItem.onclick = (e) => {
            e.stopPropagation(); 
            map.panTo(position);
            map.setZoom(16);
            infoWindow.setContent(`<b>${place.title}</b><br>${place.desc}`);
            infoWindow.open(map, marker);
          };
          
          placesList.appendChild(placeItem);
        });

        // Create Transit Info block
        const travelDiv = document.createElement('div');
        travelDiv.className = 'travel-info';
        travelDiv.innerHTML = `<h4>🚆 Transit Notes</h4><p>${day.travel}</p>`;

        dayHeader.onclick = () => {
          document.querySelectorAll('.day-card').forEach(card => {
            if (card !== dayCard) card.classList.remove('active');
          });
          
          const isActive = dayCard.classList.contains('active');
          if (isActive) {
            dayCard.classList.remove('active');
            map.fitBounds(globalBounds);
          } else {
            dayCard.classList.add('active');
            map.fitBounds(dayBounds);
            
            if (day.places.length === 1) {
               setTimeout(() => map.setZoom(15), 50);
            }
          }
        };

        dayCard.appendChild(dayHeader);
        dayCard.appendChild(placesList);
        dayCard.appendChild(travelDiv);
        sidebar.appendChild(dayCard);
      });

      map.fitBounds(globalBounds);
    }
  </script>
  
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCEiPAdSz2KKmF44XVWrkzC-eVV1MNvMfM&callback=initMap" async defer></script>
</body>
</html>
